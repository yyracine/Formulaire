[build]
  publish = "public"
  functions = "netlify/functions"

# Expose la fonction sous /api/submit (le meme chemin que sur Vercel et Cloudflare)
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200
  method = "POST"
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
